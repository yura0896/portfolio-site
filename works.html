<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="stylesheet" href="assets/css/style.css">

<body data-page="works">

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="logo" href="index.html"><span data-site="name">CHIBA YUUKI</span><small data-site="role">Animator / Illustrator</small></a>
    <div class="header-tools">
      <nav class="nav" id="nav">
        <a href="index.html">Home</a>
        <a href="works.html" aria-current="page">Works</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

      <div class="filters" role="group" aria-label="カテゴリで絞り込む">
        <button class="filter" data-filter="all" aria-pressed="true">All</button>
        <button class="filter" data-filter="animation" aria-pressed="false">Animation</button>

        <span style="align-self:center;margin-left:8px;font-size:12px;color:var(--fg-faint)" id="works-count"></span>
      </div>

      <div class="grid" id="works-grid"></div>

<footer class="site-footer">
  <div class="wrap site-footer__inner">
